[package]
name = "rpi-monitor"
version = "0.1.0"
edition = "2021"
description = "Dashboard TUI de monitoring Raspberry Pi 5 (lecture seule, sans sudo)"

[lib]
name = "rpimon"
path = "src/lib.rs"

[[bin]]
name = "rpi-monitor"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
ratatui = "0.30"
serde_json = "1.0.154"
tiny_http = "0.12.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
